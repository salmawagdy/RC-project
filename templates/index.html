<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>My Tracker</title>
</head>

<body>
    <div class = 'container'>
        <nav>
            <div class ='nav-header'>
                <h1>Purchase Tracker</h1>
                <p>Keep track of your spending</p>
            </div>  
            <ul>
                <li><img src="{{ url_for('static', filename='images/moon.png') }}" alt="mode"class='mode-icon'></li>
                <li><img src="{{ url_for('static', filename='images/list.png') }}" alt="list"class='list-icon'><a href="{{ url_for('menu') }}">View All</a></li>
    {% if session.get('user_email') %}
        <li><img id="logout-btn" src="{{ url_for('static', filename='images/logout.png') }}" alt="logout" class="logout-icon"></li>
    {% else %}
        <li><a href="{{ url_for('login') }}">Login</a></li>
        <li><a href="{{ url_for('signup') }}">Sign up</a></li>
    {% endif %}
</ul>

            </ul>
        </nav>


        <div class="cards">
            <div class="total">
            <div class="total-text">
                <p>Total Spend</p>
                <span>$0.00</span>
            </div>
            <div class="total-img">
                <img src="{{ url_for('static', filename='images/shopping-bag.png') }}" class="purchase-icon" alt="purchases">
            </div>
        </div>


        <div class="budget" id="budget-box">
            <div class="budget-text">
                <p>$</p>
                <span id ='buget-value'>Set Budget</span>
            </div>
        </div>
        </div>

<form id="purchase-form" class="purchase-form">
    <div class="form-text">
        <h2>Add New Purchase</h2>
        <p>Enter Purchase details below</p>
    </div>

    <label for="purchase">Purchase Name</label>
    <input id="purchase" name="name" type="text" placeholder="e.g., Groceries, Coffee, Gas">

    <label for="amount">Amount ($)</label>
    <input id="amount" name="amount" type="text" placeholder="0.00">

    <label for="date">Date</label>
    <input id="date" name="date" type="date">

    <button type="submit" class="submit-button">Add Purchase</button>
</form>

    </div>

    <div class="set-budget" >
        <form class="budget-form">
            <h4>Set Budget</h4>
            <label for="budget-input">Budget Amount ($)</label>
            <input type="number" id="budget-input" placeholder="0.00">

            <button type="submit" class="budget-button" id="budget-btn">Save Budget</button>
            <button type="action" class="close-btn">x</button>
        </form>
    </div>
    <script type="module" src="{{ url_for('static', filename='js/add.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/user.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/budget.js') }}"></script>
</body>
</html>
